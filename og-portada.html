<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portada OG</title>
<link href="https://fonts.googleapis.com/css2?family=Sancreek&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "PT Barnum"; src: url("assets/fonts/pt-barnum.woff2") format("woff2"), url("assets/fonts/pt-barnum.ttf") format("truetype"); }
  :root { --crema:#fff8ee; --beige:#f3dfc6; --beige-2:#e9cfae; --cafe:#4a2c1a; --cafe-2:#6b4a35; --terracota:#b4602e; --terracota-2:#8f4a20; --miel:#e3a85c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #222; display: flex; justify-content: center; }
  #og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background-color: #f3dfc6;
    background-image: url("assets/img/fondoconestampado.webp");
    background-size: cover; background-position: center;
  }
  #og > img { position: absolute; pointer-events: none; }
  .sobre {
    position: absolute; left: 50%; top: 120px; transform: translateX(-50%);
    width: 800px; height: 450px; background: var(--crema); border-radius: 26px;
    box-shadow: 0 26px 50px -18px rgba(74,44,26,.6); overflow: hidden;
  }
  .sobre::after { content:""; position:absolute; inset:14px; border:2.5px dashed rgba(180,96,46,.45); border-radius: 16px; z-index: 3; pointer-events:none; }
  .sobre svg { position:absolute; inset:0; width:100%; height:100%; z-index: 1; }
  .sello {
    position:absolute; left:50%; top:196px; transform:translate(-50%,-50%);
    width: 84px; height: 84px; border-radius: 50%; z-index: 4;
    background: var(--terracota); border: 4px solid var(--terracota-2);
    box-shadow: 0 8px 14px -6px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; color: var(--miel); font-size: 38px;
  }
  .texto { position:absolute; left:0; right:0; top:262px; text-align:center; z-index:2; }
  .titulo { font-family: "PT Barnum","Sancreek",Georgia,serif; font-size: 82px; line-height: 1; color: var(--cafe); text-transform: uppercase; }
  .nombre { font-family: "PT Barnum","Sancreek",Georgia,serif; font-size: 46px; line-height: 1; color: var(--terracota); margin-top: 16px; }
</style>
</head>
<body>
<div id="og">
  <img src="assets/img/ramo-margaritas.webp" style="left:-40px; top:-20px; width:260px; opacity:.9" alt="">
  <img src="assets/img/ramito.webp" style="right:-30px; top:-10px; width:230px; transform:scaleX(-1); opacity:.9" alt="">
  <img src="assets/img/estrella.webp" style="left:230px; top:60px; width:38px; transform:rotate(-12deg)" alt="">
  <img src="assets/img/estrella.webp" style="right:230px; top:80px; width:30px; transform:rotate(14deg)" alt="">
  <img src="assets/img/herradura.webp" style="left:70px; bottom:30px; width:90px; transform:rotate(-20deg)" alt="">
  <img src="assets/img/herradura.webp" style="right:70px; bottom:30px; width:90px; transform:rotate(20deg) scaleX(-1)" alt="">

  <div class="sobre">
    <svg viewBox="0 0 800 450" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="0,0 800,0 400,200" fill="#e9cfae" stroke="#b4602e" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <div class="texto">
      <p class="titulo">Graduación</p>
      <p class="nombre">Angel Saavedra</p>
    </div>
    <div class="sello">★</div>
  </div>

  <img src="assets/img/sombrero.webp" style="left:50%; top:-30px; width:360px; transform:translateX(-50%) rotate(-3deg); filter:drop-shadow(0 10px 12px rgba(74,44,26,.3)); z-index:5" alt="">
</div>
</body>
</html>
